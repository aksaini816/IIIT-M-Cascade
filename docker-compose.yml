services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kindora
      POSTGRES_USER: kindora
      POSTGRES_PASSWORD: kindora_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kindora -d kindora"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - kindora-postgres:/var/lib/postgresql/data
  evm:
    image: ghcr.io/foundry-rs/foundry:latest
    profiles: ["evm"]
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545"]
    ports:
      - "8545:8545"

volumes:
  kindora-postgres:
